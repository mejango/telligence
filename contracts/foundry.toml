[profile.default]
solc = '0.8.28'
bytecode_hash = "none"
evm_version = 'cancun'
via_ir = true
optimizer_runs = 200
libs = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 4096

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci.fuzz]
runs = 256

[profile.ci.invariant]
runs = 64
depth = 50

[lint]
exclude_lints = ["mixed-case-variable", "pascal-case-struct"]
lint_on_build = false

[rpc_endpoints]
base = "${RPC_BASE_MAINNET}"

[fmt]
number_underscore = "thousands"
multiline_func_header = "all"
wrap_comments = true
