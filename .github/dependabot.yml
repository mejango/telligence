version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/web", "/services", "/contracts"]
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 0
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(actions)"
  - package-ecosystem: docker
    directories: ["/web", "/services"]
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 0
    labels: [dependencies, deployment]
    commit-message:
      prefix: "chore(container)"
